    population: ""
    sex: unknown
    batch: ""
    truth_assembly_hap1: ../whole_pangenome/assembly_decontamination/results/cleaned/2348252.hifi.hifiasm.bp.hap1.p_ctg.clean.fa.gz
    truth_assembly_hap2: ../whole_pangenome/assembly_decontamination/results/cleaned/2348252.hifi.hifiasm.bp.hap2.p_ctg.clean.fa.gz
    truth_callset: ""
    callable_regions: ""
    role: local_v1_member_control
    include: true
    inclusion_reason: deterministic_local_v1_member_rank_2_seed_20260806_both_haplotypes_PASS_AD_archive_cohort
    exclusion_reason: ""
    simulation: false
    stage_from_archive: true

  # These are rescue-source positive controls, never held-out observations.
  - sample_id: "8062838"
    data_type: hifi
    long_read: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/hifi/fastq/8062838.hifi.fastq.gz
    r1: ""
    r2: ""
    nominal_coverage: ""
    selected_coverage: 20
    cohort: local_ad
    archive_cohort: ad
    population: ""
    sex: ""
    batch: ""
    truth_assembly_hap1: ../whole_pangenome/assembly_decontamination/results/cleaned/8062838.hifi.hifiasm.bp.hap1.p_ctg.clean.fa.gz
    truth_assembly_hap2: ../whole_pangenome/assembly_decontamination/results/cleaned/8062838.hifi.hifiasm.bp.hap2.p_ctg.clean.fa.gz
    truth_callset: ../whole_pangenome/sv_pangenome/novel_sv_discovery/reference_calls/CHM13/dipcall/8062838.vcf.gz
    callable_regions: ../whole_pangenome/sv_pangenome/novel_sv_discovery/reference_calls/CHM13/dipcall/8062838.callable.bed.gz
