# Standalone read-to-reference benchmark. Paths are interpreted relative to the
# repository root unless they are absolute server paths.
results: ../whole_pangenome/read_graph_benchmark

reference_backbone: CHM13v2.0
graph_registry:
  - graph_id: chm13_linear
    label: Plain T2T-CHM13 v2.0
    comparison_scope: headline
    graph_type: linear_fasta
    backbone: CHM13
    reference_version: T2T-CHM13v2.0
    path: ../refs/CHM13.fa.gz
    membership_manifest: ""
    checksum: ""
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [long_reads]
    required_for_long: true
    experimental: false
    qc_status: reference
    provenance: https://www.ncbi.nlm.nih.gov/datasets/genome/GCF_009914755.1/

  - graph_id: hprc_chm13_sv
    label: HPRC v2.0 CHM13 SV graph
    comparison_scope: headline
    graph_type: minigraph_rgfa
    backbone: CHM13
    reference_version: HPRC-v2.0-mc-chm13.sv / T2T-CHM13v2.0 backbone
    path: /gpfs/work3/0/qtholstg/pangenome/HPRC/graphs/hprc-v2.0-mc-chm13.sv.gfa.gz
    membership_manifest: /gpfs/work3/0/qtholstg/pangenome/HPRC/assemblies/assemblies.tsv
    membership_format: hprc_assemblies
    checksum: ""
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [long_reads]
    required_for_long: true
    experimental: false
    qc_status: released_input
    provenance: HPRC release-2 Minigraph-Cactus SV graph

  - graph_id: local_v1
    label: Local cohort SV graph V1 (196 haplotypes)
    comparison_scope: headline
    graph_type: minigraph_rgfa
    backbone: CHM13
    reference_version: T2T-CHM13v2.0 backbone
    path: ../whole_pangenome/sv_pangenome/results/graphs/sv_pangenome.minigraph.gfa
    membership_manifest: ../whole_pangenome/sv_pangenome/results/metadata/sv_pangenome.ordered_assemblies.tsv
    membership_format: local_v1_ordered_assemblies
    checksum: 0e70963827a23c6152e6d88696bd6babb327797675a760d6263cfde7f2befe19
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [long_reads]
    required_for_long: true
    experimental: false
    qc_status: frozen_graph
    provenance: ../whole_pangenome/sv_pangenome/results/metadata/sv_pangenome.graph_summary.tsv

  - graph_id: local_v2
    label: Local cohort SV graph V2 with rescued SVs (experimental)
    comparison_scope: headline
    graph_type: minigraph_rgfa
    backbone: CHM13
    reference_version: T2T-CHM13v2.0 backbone
    path: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/graphs/sv_pangenome.local.v2.rescued.minigraph.gfa
    membership_manifest: ../whole_pangenome/sv_pangenome/results/metadata/sv_pangenome.ordered_assemblies.tsv
    membership_format: local_v2_union
    rescue_manifest: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/rescue/rescue_summary.tsv
    checksum: 880fa3bb2d474678e1d6e2d4d38bc248ea0ab8a4ebc9b28857c93dd3dd427c3e
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [long_reads]
    required_for_long: true
    experimental: true
    qc_status: FAIL_cohort_accounting_structural_integrity_pass
    provenance: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/metadata/sv_pangenome.local.v2.provenance.tsv
    qc_report: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/qc/report/local_sv_graph_v2_qc_report.md

  - graph_id: hprc_plus_local
    label: HPRC CHM13 SV graph plus 196 local haplotypes
    comparison_scope: headline
    graph_type: minigraph_rgfa
    backbone: CHM13
    reference_version: HPRC-v2.0-mc-chm13.sv plus local V1 assemblies
    path: ../whole_pangenome/hprc_plus_cohort/graphs/hprc-v2.0-mc-chm13.cohort.sv.gfa
    membership_manifest: /gpfs/work3/0/qtholstg/pangenome/HPRC/assemblies/assemblies.tsv
    membership_format: hprc_plus_local_v1
    local_membership_manifest: ../whole_pangenome/sv_pangenome/results/metadata/sv_pangenome.ordered_assemblies.tsv
    checksum: ""
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [long_reads]
    required_for_long: true
    experimental: true
    qc_status: preflight_passed_membership_auditable
    provenance: workflow/rules/hprc_plus_cohort.smk

  # Regional Minigraph-Cactus graph used only for the TMEM pilot. It is not a
  # sixth whole-genome target and is never included in headline contrasts.
  - graph_id: tmem_regional_gbz
    label: TMEM106B regional Minigraph-Cactus graph
    comparison_scope: tmem_pilot
    graph_type: gbz
    backbone: GRCh38
    reference_version: GRCh38 chr7:11946976-12488798 regional graph
    path: /gpfs/work3/0/qtholstg/pangenome/TMEM_UPD/tmem_out/pangenome_cactus_pipeline.d2.gbz
    indexes:
      dist: ../whole_pangenome/read_graph_benchmark/tmem/indexes/vg-1.76.1/tmem_regional_gbz.dist
      minimizer: ../whole_pangenome/read_graph_benchmark/tmem/indexes/vg-1.76.1/tmem_regional_gbz.shortread.withzip.min
      zipcodes: ../whole_pangenome/read_graph_benchmark/tmem/indexes/vg-1.76.1/tmem_regional_gbz.shortread.zipcodes
    membership_manifest: ""
    checksum: ""
    checksum_file: ""
    verify_checksum: false
    mapping_capabilities: [short_reads]
    required_for_long: false
    experimental: true
    qc_status: regional_pilot_only
    provenance: /gpfs/work3/0/qtholstg/pangenome/TMEM_UPD/tmem_out/pangenome_cactus_pipeline.vcf.gz

samples:
  # Deterministic local-V1 member controls. Eligible donors were restricted to
  # the AD archive cohort and required both haplotypes in local V1 with post-QC
  # PASS status. Ranking the 16 eligible donors by SHA-256 of the exact UTF-8
  # string "20260806:<sample_id>" (no trailing newline) selected these two.
  - sample_id: "19R0534"
    data_type: hifi
    long_read: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/hifi/fastq/19R0534.hifi.fastq.gz
    r1: ""
    r2: ""
    nominal_coverage: ""
    selected_coverage: 20
    cohort: local_ad
    archive_cohort: ad
    population: ""
    sex: unknown
    batch: ""
    truth_assembly_hap1: ../whole_pangenome/assembly_decontamination/results/cleaned/19R0534.hifi.hifiasm.bp.hap1.p_ctg.clean.fa.gz
    truth_assembly_hap2: ../whole_pangenome/assembly_decontamination/results/cleaned/19R0534.hifi.hifiasm.bp.hap2.p_ctg.clean.fa.gz
    truth_callset: ""
    callable_regions: ""
    role: local_v1_member_control
    include: true
    inclusion_reason: deterministic_local_v1_member_rank_1_seed_20260806_both_haplotypes_PASS_AD_archive_cohort
    exclusion_reason: ""
    simulation: false
    stage_from_archive: true
  - sample_id: "2348252"
    data_type: hifi
    long_read: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/hifi/fastq/2348252.hifi.fastq.gz
    r1: ""
    r2: ""
    nominal_coverage: ""
    selected_coverage: 20
