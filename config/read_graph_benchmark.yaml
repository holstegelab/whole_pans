long_reads:
  default_selected_coverage: 20
  genome_size_bp: 3054815472
  selection_seed: 20260806
  minigraph_preset: lr
  minigraph_extra: ""
  minimap2_preset: map-hifi
  minimap2_extra: "--secondary=yes"
  threads: 24
  mem_mb: 64000
  runtime_min: 720
  disk_mb: 20000
  metrics_mem_mb: 8000
  metrics_runtime_min: 120

# Only samples with stage_from_archive=true are recalled. Final FASTQs share
# the existing persistent HiFi staging directory and are never overwritten
# when already present and up to date.
long_read_archive_staging:
  assembly_manifest: ../whole_pangenome/sv_pangenome/novel_sv_discovery/manifest/assembly_discovery_manifest.tsv
  centenarian_samples: ../chc_samples_list.txt
  header_template: ../hdr.pacbio.txt
  archive_root: /archive/hulsmanm/pacbio_processed/project/holstegelab/Share/pacbio/data_processed/merged_data_ad_centenarians
  archive_bam_pattern: "{archive_root}/{cohort}/{sample}/{sample}.merged.hifi.hg38.bam"
  fastq_pattern: ../whole_pangenome/sv_pangenome/local_sv_graph_v2/hifi/fastq/{sample}.hifi.fastq.gz
  daget: /opt/dacommands/bin/daget
  dals: /opt/dacommands/bin/dals
  poll_seconds: 30
  max_wait_min: 1440
  archive_partition: archive
  stage_mem_mb: 100
  stage_runtime_min: 1500
  copy_mem_mb: 100
  copy_runtime_min: 720
  conversion_threads: 8
  conversion_mem_mb: 16000
  conversion_runtime_min: 720
  conversion_disk_mb: 250000

simulation:
