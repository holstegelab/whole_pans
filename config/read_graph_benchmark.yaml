tmem_pilot:
  graph_ids: [tmem_regional_gbz]
  vg_version: "1.76.1"
  random_seed: 20260808
  random_blinded_count: 4
  fastq_manifests:
    - /home/gozhegov/data/DemenTree/NL_DemenTree_batch1.tsv
    - /home/gozhegov/data/DemenTree/NL_DemenTree_batch2.tsv
    - /home/gozhegov/data/DemenTree/NL_DemenTree_batch3.tsv
    - /home/gozhegov/data/DemenTree/NL_DemenTree_batch4.tsv
  manifest_columns:
    batch: 1
    sample: 2
    data_type: 3
    r1: 7
    r2: 8
  coverage_proxy_table: /gpfs/work3/0/qtholstg/pangenome/TMEM_UPD/shortread_19kb/results/summary/strict_junction_sample_summary.tsv
  coverage_proxy_column: mapped_records
  target_insertions: /gpfs/work3/0/qtholstg/pangenome/TMEM_UPD/shortread_19kb/results/graph/target_insertions.tsv
  graph_vcf: /gpfs/work3/0/qtholstg/pangenome/TMEM_UPD/tmem_out/pangenome_cactus_pipeline.vcf.gz
  pairs:
    - [NL_DemenTree_batch1_2410011p01, NL_DemenTree_batch1_2410021p02]
    - [NL_DemenTree_batch1_2410004p02, NL_DemenTree_batch1_6224]
    - [NL_DemenTree_batch2_2410035p02, NL_DemenTree_batch2_2310037p02]
    - [NL_DemenTree_batch3_2410022p03, NL_DemenTree_batch3_2410027p01]
    - [NL_DemenTree_batch4_2310003p01, NL_DemenTree_batch4_2410075p02]
    - [NL_DemenTree_batch4_2003-075, NL_DemenTree_batch4_2410036p03]
  kmer_size: 31
  edge_window_bp: 250
  min_mapq: 5
  # Locked after the prior strict screen: candidates have >=21 reads on their
  # limiting junction, while matched controls have <=2. This pilot is a
  # confirmation of that screen, not independent genotype truth.
  min_junction_reads_per_side: 3
  min_reference_reads: 3
  threads: 24
  mem_mb: 32000
  runtime_min: 480
  disk_mb: 10000

# Preliminary short-read QC against the existing whole-genome SV-level rGFAs.
# The generated GBZs contain an artificial greedy path cover; they are derived
# experimental indexes and do not change the raw rGFA mapping capabilities above.
sv_short_read_pilot:
  enabled: true
  graph_ids:
    - hprc_chm13_sv
    - local_v1
    - local_v2
    - hprc_plus_local
  baseline_graph: hprc_chm13_sv
  sample_roles:
    - tmem_candidate
    - tmem_random_blinded
  include_matched_controls: false
  expected_role_counts:
    tmem_candidate: 6
    tmem_random_blinded: 4
    tmem_matched_control: 6
  mode: full
  smoke_max_pairs: 5000000
  subsampling_seed: 20260901
  mapper: vg_giraffe
  index_mode: rgfa_artificial_path_cover
  vg_version: "1.76.1"
  min_mapq: 5
  min_junction_reads_per_side: 3
  retain_debug_gaf: false
  require_smoke_before_full: true
  smoke_min_mapped_fraction: 0.80

  # Inputs used only to derive allele queries. Regional graph node IDs are not
  # propagated into any whole-genome graph target definition.
  regional_graph_vcf: ../TMEM_UPD/tmem_out/pangenome_cactus_pipeline.vcf.gz
  target_insertions: ../TMEM_UPD/shortread_19kb/results/graph/target_insertions.tsv
  regional_reference_fasta: ../TMEM_UPD/tmem.hg38.fa
  regional_vcf_position_offset: 150000
  target_flank_bp: 1000
  target_min_flank_aligned_bp: 900
  target_min_query_coverage: 0.95
  target_min_identity: 0.90
  target_min_mapq: 20
  target_threads: 16
  target_mem_mb: 64000
  target_runtime_min: 240

  threads: 24
  mem_mb: 64000
  runtime_min: 1440
  disk_mb: 100000
  index_threads: 32
  # Source rGFAs are about 3.5-4.3 GB uncompressed locally. The larger limits
  # leave room for GBWT/path-cover construction and node-local intermediates.
  index_mem_mb: 256000
  index_runtime_min: 2880
  index_disk_mb: 500000
  metrics_mem_mb: 4000
  metrics_runtime_min: 120

sv_catalog:
  inputs:
    - path: ../whole_pangenome/sv_pangenome/novel_sv_discovery/catalog/provisional_graph_residual_sv_catalog.tsv
      format: provisional_catalog
      source_graph: local_v1
      discovery_method: existing_normalized_assembly_evidence
  breakpoint_distance: 500
  length_similarity: 0.70
  sequence_similarity: 0.80

resources:
  metadata_mem_mb: 4000
  metadata_runtime_min: 60
  report_mem_mb: 8000
  report_runtime_min: 120
